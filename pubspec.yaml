name: lizzieyzy_mobile
description: Open-source camera-first KataGo review for iOS and Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  big5_utf8_converter: ^1.2.0
  camera: ^0.12.0+1
  charset: ^2.0.1
  cp949_codec: ^1.0.2
  crypto: ^3.0.7
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  google_mlkit_text_recognition: ^0.16.0
  image: ^4.9.1
  image_picker: ^1.2.3
  intl: ^0.20.2
  path_provider: ^2.1.6
  share_plus: ^13.2.0
  shared_preferences: ^2.5.5
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/legal/cocoapods_third_party_licenses.txt
    - assets/legal/maven_third_party_licenses.txt
